[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pam-manager"
version = "0.2.0"
description = "Production-quality PAM configuration management tool for FreeBSD and Linux"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "PAM Manager Contributors", email = "admin@example.com"},
]
keywords = [
    "pam",
    "authentication",
    "linux",
    "freebsd",
    "security",
    "system-administration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX :: BSD",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration :: Authentication/Logout",
]
dependencies = [
    "pyyaml>=6.0",
    "typing-extensions>=4.8.0; python_version<'3.12'",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "types-PyYAML>=6.0.12",
    "ruff>=0.1.0",
    "black>=23.9.0",
    "pre-commit>=3.3.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.scripts]
pam-manager = "pam_manager.cli:main"
pam-config = "pam_manager.cli:main"

[project.urls]
Homepage = "https://github.com/Du5atko/PAM-Manager"
Documentation = "https://github.com/Du5atko/PAM-Manager/tree/main/docs"
Repository = "https://github.com/Du5atko/PAM-Manager"
Issues = "https://github.com/Du5atko/PAM-Manager/issues"

[tool.setuptools]
packages = ["pam_manager"]

[tool.setuptools.package-data]
pam_manager = [
    "policy/schema.yaml",
    "modules/database.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --tb=short -v"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "platform: Platform-specific tests",
]
minversion = "7.0"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["pam_manager/**/*.py", "tests/**/*.py"]
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "W605",  # invalid escape sequence
]

[tool.ruff.lint.isort]
known-first-party = ["pam_manager"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.pytest_cache
  | \.venv
  | venv
  | __pycache__
  | build
  | dist
)/
'''
